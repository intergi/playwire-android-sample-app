plugins {
    id 'com.android.application'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.playwire.demo_java"
        minSdk 24
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "distribution"
    productFlavors {
        total {
            dimension "distribution"
            applicationIdSuffix ".total"
            versionNameSuffix "-total"
        }
//        coppa {
//            dimension "distribution"
//            applicationIdSuffix ".coppa"
//            versionNameSuffix "-coppa"
//        }
    }
    namespace 'com.playwire.demo_java'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.firebase:firebase-analytics-ktx:21.1.1'
    /// Total
    totalImplementation 'com.intergi.playwire:playwiresdk_total:11.5.2'
    /// COPPA
//    coppaImplementation 'com.intergi.playwire:playwiresdk_coppa:11.5.2'
}

